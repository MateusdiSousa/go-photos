syntax = "proto3";

package storage.v1;

option go_package = "github.com/MateusdiSousa/go-photos/api/proto/storagev1";

message UploadRequest {
  string user_id = 1;
  string filename = 2;
  string media_type = 3;
  string mimetype = 4;
  string metadados = 5;
  int64 size = 6;
  bytes chunks = 7;
}

message UploadResponse {
  string cmd_id = 1;
  int64 size = 2;
}

message GetMediaRequest {
  string user_id = 1;
  int64 page_size = 2;
  int64 page_num = 3;
}

message MediaInfo {
  string filename = 1;
  string media_type = 2;
  string created_at = 3;
  string metadata = 4;
  string url = 5;
  string thumbnail = 6;
}

message GetMediaResponse {
  repeated MediaInfo media_urls = 1;
}

service StorageService {
  rpc Upload(stream UploadRequest) returns (UploadResponse);
  rpc GetMedia(GetMediaRequest) returns (GetMediaResponse);
}
