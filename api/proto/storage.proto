syntax = "proto3";

package storage.v1;

option go_package = "github.com/MateusdiSousa/go-photos/api/proto/storagev1";

message UploadRequest {
  string user_id = 1;
  string filename = 2;
  string media_type = 3;
  string mimetype = 4;
  string metadados = 5;
  int64 size = 6;
  bytes chunks = 7;
}

message UploadResponse {
  string file_id = 1;
  int64 size = 2;
}

service StorageService {
  rpc Upload(stream UploadRequest) returns (UploadResponse);
}
